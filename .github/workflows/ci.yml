name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml
        env:
          # Unit tests use SQLite + fakeredis + fake Kafka publisher — no
          # real Postgres/Redis/Kafka needed for this job. docker-compose
          # up is how you get the full stack for manual/load testing.
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
