[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/outbox_relay.py"]  # its _main() only runs as a standalone process

[tool.coverage.report]
skip_empty = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv_check"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line length — not worth the churn
    "B008",  # function-call-in-default-argument — standard FastAPI
             # `Depends(...)` pattern, not a bug
]
